<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14110d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}body{background:#17140f}</style></head><body><title>Operation REE 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky pill nav over one wide column. Dark warm ground, lime as the single loud accent, coral/blue/yellow/purple/teal as member colours. Committed dark look, so no light variant. */
:root{
  --bg:#17140f; --surface:#211d17; --surface2:#2a251e; --line:#37312a; --ink:#f4efe6; --muted:#a39b8e;
  --cream:#f4efe6; --cream-ink:#1c1812; --cream-line:#d9d3c4;
  --lime:#c8f135; --lime-ink:#172000; --coral:#ff6b4a; --blue:#5cc8ff; --yellow:#ffd23f; --purple:#c08cff; --teal:#4de0b8;
  --good:#4de0b8; --bad:#ff7a66;
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:20px;padding-block:0 64px;
  background:radial-gradient(900px 520px at 6% -4%,rgba(200,241,53,.08),transparent 62%),radial-gradient(900px 620px at 102% 6%,rgba(255,107,74,.09),transparent 62%),repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 46px),var(--bg);background-color:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
.ic{display:inline-flex;flex:none}
.ic svg{display:block}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.eyebrow.dim{color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-20px;padding-inline:20px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.05)}
.top-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand right" "nav nav";gap:8px 16px;align-items:center;padding-block:10px 8px}
.brand{grid-area:brand;white-space:nowrap;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo{position:relative;width:42px;height:42px;flex:none}
.logo i{position:absolute;inset:0;background:var(--coral);border-radius:13px;transform:rotate(-9deg) translate(3px,3px)}
.logo b{position:absolute;inset:0;background:var(--lime);color:var(--lime-ink);border-radius:12px 15px 12px 16px;display:grid;place-items:center;font-size:19px}
#nav{flex:1;display:flex;gap:4px;overflow-x:auto;min-width:0;scrollbar-width:none;scroll-behavior:smooth;cursor:grab;-webkit-overflow-scrolling:touch}
#nav::-webkit-scrollbar{display:none}
#nav.drag{cursor:grabbing;scroll-behavior:auto;user-select:none}
.navwrap{grid-area:nav;position:relative;min-width:0;display:flex;align-items:center;gap:6px}
.navwrap.fl #nav{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
.navwrap.fr #nav{-webkit-mask-image:linear-gradient(270deg,transparent,#000 36px);mask-image:linear-gradient(270deg,transparent,#000 36px)}
.navwrap.fl.fr #nav{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.navarr{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
.navarr:hover{border-color:var(--lime);color:var(--lime)}
.navarr[hidden]{display:none}
#nav button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:10px 16px;border-radius:99px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
#nav button:hover{color:var(--ink)}
#nav button[aria-current="page"]{background:var(--cream);color:var(--cream-ink)}
#topr{grid-area:right;display:flex;align-items:center;gap:12px}
.chip-streak{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,107,74,.5);background:rgba(255,107,74,.12);color:var(--coral);border-radius:99px;padding:7px 14px;font-family:var(--f-mono);font-weight:700;font-size:13px;white-space:nowrap}
.me-btn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;padding:8px}
.linkbtn:hover{color:var(--ink)}
@media (max-width:520px){.brand{font-size:17px;gap:8px;min-width:0}.top-in{gap:6px 8px}.chip-streak{padding:6px 10px;font-size:12px}#topr{gap:8px}.logo{width:36px;height:36px}}
.gearbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.gearbtn:hover{color:var(--ink);border-color:var(--lime)}
.gearbtn[aria-current="page"]{background:var(--cream);color:var(--cream-ink);border-color:transparent}

/* avatar */
.av{--c:var(--lime);display:inline-grid;place-items:center;border-radius:50%;flex:none;background:color-mix(in srgb,var(--c) 22%,var(--surface));line-height:1}
.av.ring{border:2.5px solid var(--c)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:transparent;padding:11px 20px;border-radius:14px;font-weight:700;cursor:pointer;transition:transform .12s,filter .12s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.cream{background:var(--cream);color:var(--cream-ink);border-color:var(--cream)}
.btn.alt{background:var(--coral);color:#2a0d05;border-color:var(--coral)}
.btn.danger{color:var(--bad);border-color:rgba(255,122,102,.45)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:11px}
.btn.lg{padding:16px 26px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.xbtn{width:40px;height:40px;padding:0;border-radius:12px}

/* layout bits */
main{max-width:1180px;margin:0 auto;padding-top:30px;display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;min-width:0}
.card.cream{background:var(--cream);color:var(--cream-ink);border-color:var(--cream)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(36px,6vw,64px);font-weight:800;letter-spacing:-.035em}
.pagehead .eyebrow{display:block;margin-bottom:10px}
.h2{font-size:24px;font-weight:700}
.banner{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:11px 16px;font-size:14px;color:var(--muted)}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-size:24px}
.empty p{margin:0;max-width:46ch;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill.lime{background:rgba(200,241,53,.13);border-color:rgba(200,241,53,.35);color:var(--lime)}
.pill.coral{background:rgba(255,107,74,.15);border-color:rgba(255,107,74,.4);color:var(--coral)}
.pill.gold{background:rgba(255,210,63,.14);border-color:rgba(255,210,63,.4);color:var(--yellow)}
.badgect{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:99px;background:var(--coral);color:#2a0d05;font-weight:800;font-size:13px;padding-inline:7px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .big{font-family:var(--f-display);font-size:clamp(34px,4vw,46px);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:14px}
.tile .lab{color:var(--muted)}
.exam-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 22px}
.exam-card .n{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.exam-card .l{color:var(--muted);font-size:14px}

/* squad goal */
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.goal-top h2{font-size:24px;font-weight:700}
.goal-top .n{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.segbar{display:flex;height:28px;border-radius:99px;overflow:hidden;background:#dcd7ca;margin-block:18px 14px}
.segbar i{display:block;height:100%;border-right:2px solid var(--cream);min-width:0}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{width:11px;height:11px;border-radius:50%;display:inline-block}

/* home grid */
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar{transition:opacity .12s}
.chart g.col:hover .bar{opacity:.85}
.chart g.col:hover .hit{fill:rgba(255,255,255,.04)}
.chart .hit{fill:transparent}
.chart-legend{display:flex;gap:18px;justify-content:center;margin-block:6px 10px;font-size:13px;color:var(--muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:7px}
.chart-legend b{width:11px;height:11px;border-radius:3px;display:inline-block}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:grid;grid-template-columns:22px 38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;border:1px solid transparent}
.lb li.me{border-color:rgba(200,241,53,.4);background:rgba(200,241,53,.08)}
.lb .r{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.lb .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .v{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.sectionlink{background:none;border:0;color:var(--lime);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mini{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;cursor:pointer;text-align:left;min-width:0;width:100%}
.mini:hover{border-color:var(--muted)}
.mini .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .s{font-size:13px;color:var(--muted)}
.mini .body{flex:1;min-width:0}
.tileic{display:grid;place-items:center;border-radius:16px;flex:none;font-size:26px;width:54px;height:54px;background:color-mix(in srgb,var(--c,#888) 20%,var(--surface))}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{padding:11px 0;display:flex;gap:12px;align-items:center}
.feed li+li{border-top:1px solid var(--line)}
.feed .em{font-size:20px;width:26px;text-align:center;flex:none}
.feed .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.feed .tm{color:var(--muted);font-family:var(--f-mono);font-size:12px;flex:none}

/* decks */
.searchbar{position:relative;flex:1;min-width:220px;max-width:420px}
.searchbar .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbar input{padding-left:42px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--cream-ink);border-color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.dk{display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden}
.dk-top{padding:22px 22px 0;display:flex;flex-direction:column;gap:14px;min-height:0}
.dk-top .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dk h3{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.dk .meta{color:var(--muted);font-size:14px}
.dk-own{display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);font-weight:600}
.dk-act{display:flex;gap:8px;flex-wrap:wrap;padding:12px 22px 20px;background:rgba(255,255,255,.025)}

/* ranks */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;max-width:780px;margin:12px auto 0;width:100%}
.pcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.medal{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#2a1c00;margin-bottom:-14px;position:relative;z-index:1;border:2px solid var(--bg)}
.pcol .nm{font-weight:800;font-size:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcol .val{font-family:var(--f-mono);color:var(--lime);font-weight:700;font-variant-numeric:tabular-nums}
.pcol .blk{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:start center;padding-top:12px;font-family:var(--f-display);font-weight:800;font-size:44px;color:#241c10;margin-top:6px}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rk li{display:grid;grid-template-columns:30px 42px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.rk li.me{border-color:rgba(200,241,53,.45);background:rgba(200,241,53,.07)}
.rk .r{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted);text-align:center}
.rk .who{min-width:0}
.rk .who button{background:none;border:0;padding:0;font-weight:800;font-size:16px;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.rk .who button:hover{color:var(--lime)}
.rk .sub{font-size:13px;color:var(--muted)}
.rk .v{font-family:var(--f-mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}

/* members */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.req{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.req .quote{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px;color:var(--ink);overflow-wrap:anywhere}
.mem{display:flex;align-items:center;gap:14px;padding:14px 0}
.mem+.mem{border-top:1px solid var(--line)}
.mem .info{flex:1;min-width:0}
.mem .info b{display:flex;align-items:center;gap:8px}
.mem .info span.s{color:var(--muted);font-size:13px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.steps b{color:var(--ink)}

/* forms */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface2);border-radius:13px;padding:12px 14px;width:100%;min-width:0;color:var(--ink)}
input[type=file]{max-width:100%}
button,.btn,.chip,.mini{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:700px){input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{font-size:16px}.btn{min-height:42px}}
input::placeholder,textarea::placeholder{color:#7c756a}
textarea{resize:vertical;min-height:84px}
input[type=checkbox]{accent-color:var(--lime);width:18px;height:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 16px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.erow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:start}
.erow .sol{grid-column:1/-1}
@media (max-width:560px){.erow{grid-template-columns:1fr auto}.erow .qa{grid-column:1}}
.iconpick{display:flex;gap:6px;flex-wrap:wrap}
.iconpick button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:22px;cursor:pointer}
.iconpick button[aria-pressed="true"]{border-color:var(--lime);background:rgba(200,241,53,.14)}
.gen{border:1px dashed rgba(200,241,53,.5);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:rgba(200,241,53,.05)}

/* study */
.panel{max-width:780px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:20px}
.runbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:120px;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .25s}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{border:1px solid var(--line);background:var(--surface2);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--f-display);font-size:17px}
.mode span{font-size:12px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--lime);background:rgba(200,241,53,.1)}
.mode:disabled{opacity:.4;cursor:not-allowed}
.flip{perspective:1400px}
.flip-in{position:relative;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip{max-width:840px;width:100%;margin:0 auto}
.flip-in{height:400px}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--cream);color:var(--cream-ink);border-radius:32px;padding:34px 40px;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;text-align:center;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.face .eyebrow{color:#7a7364;text-align:left}
.face .t{font-family:var(--f-display);font-size:clamp(24px,4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.12;overflow-wrap:anywhere;margin:auto;padding-block:10px}
.face .hint{font-family:var(--f-body,inherit);font-size:14px;font-weight:500;color:#7a7364;text-align:center}

function h(tag,props){
  var e=document.createElement(tag);
  props=props||{};
  Object.keys(props).forEach(function(k){
    var v=props[k];
    if(v==null||v===false)return;
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  });
  for(var i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(function(c){
      if(c==null||c===false)return;
      e.append(c.nodeType?c:document.createTextNode(String(c)));
    });
  }
  return e;
}

function levelInfo(xp){var L=level(xp),lo=40*(L-1)*(L-1),hi=40*L*L;return{L:L,lo:lo,hi:hi,pct:Math.round(100*(xp-lo)/(hi-lo))}}
function totals(id){
  var d=S.stats[id],base={cards:0,right:0,xp:0,secs:0,n:0,perfect:0,exams:0,mast:0};
  if(d&&d.tot)return Object.assign(base,d.tot);
  sessionsOf(id).forEach(function(s){
    base.cards+=s.total;base.right+=s.right;base.xp+=xpFor(s);base.secs+=s.secs||0;base.n++;
    if(s.right===s.total&&s.total>=8)base.perfect++;

  return base;
}
function streak(ss){
  var days=new Set(ss.map(function(s){return dk(s.t)}));
  var d=new Date();
  if(!days.has(dk(d)))d=prevDay(d);
  var n=0;
  while(days.has(dk(d))){n++;d=prevDay(d)}
  return n;
}

  return{t:t,cardsWeek:sum(wk,function(s){return s.total}),secsWeek:sum(wk,function(s){return s.secs||0}),
    acc:t.cards>=10?Math.round(100*t.right/t.cards):null,accRaw:t.cards?Math.round(100*t.right/t.cards):null,
    streak:streak(ss),last:ss.length?ss[ss.length-1].t:0,owned:S.decks.filter(function(d){return d.owner===id}).length};

var chain=Promise.resolve();
function writeFailed(e){
  if(e&&e.code==='invalid_argument'){S.canWrite=false;toast('You can look around, but your access level does not let you save.')}
  else if(e&&e.code==='quota_exceeded'){toast('The club’s storage is full. Delete old decks, games or GIF messages to make room.')}
  else toast('Could not save. Check your connection and try again.');

function putStats(patch){
  var cur=S.stats[S.uid]||{};
  var next=Object.assign({},cur,patch,{name:S.myName||cur.name||'',updatedAt:Date.now()});
  S.stats[S.uid]=next;
  if(!S.db||!S.uid)return;
  var body=JSON.parse(JSON.stringify(next));
  while(JSON.stringify(body).length>230000&&body.sessions&&body.sessions.length>40)body.sessions=body.sessions.slice(Math.ceil(body.sessions.length/4));
  chain=chain.then(function(){return S.db.doc('stats/'+S.uid).set(body)}).catch(writeFailed);
}
function saveSession(sess,results){
  var cur=S.stats[S.uid]||{},old=totals(S.uid),oldL=level(old.xp);
  var cm=Object.assign({},cur.cm||{}),size=Object.keys(cm).length;
  (results||[]).forEach(function(x){
    var k=ck(x.d,x.q),n=cm[k];
    if(x.ok){if(n!=null||size<6000){if(n==null)size++;cm[k]=Math.min(3,(n||0)+(x.w||1))}}
    else if(n!=null)cm[k]=0;
  });
  var mast=0;Object.keys(cm).forEach(function(k){if(cm[k]>=3)mast++});
  var t={cards:old.cards+sess.total,right:old.right+sess.right,xp:old.xp+xpFor(sess),secs:old.secs+(sess.secs||0),n:old.n+1,
    perfect:old.perfect+((sess.right===sess.total&&sess.total>=8)?1:0),exams:old.exams+(sess.mode==='exam'?1:0),mast:mast};
  var arr=sessionsOf(S.uid).concat([sess]).slice(-300);
  if(S.run)S.run.xp=xpFor(sess);
  if(level(t.xp)>oldL)setTimeout(function(){toast('Level up. You are now level '+level(t.xp)+'.');confetti()},500);
  putStats({sessions:arr,tot:t,cm:cm});
}

  if(!gid||!S.db)return;

    var m={};snap.docs.forEach(function(d){var x=d.data()||{};if(x.uid)m[x.uid]=x});

function buildQs(deckId,n){

function barChart(labels,series,label){
  var W=640,H=250,pl=34,pr=6,pt=10,pb=28,mx=10;
  series.forEach(function(s){s.vals.forEach(function(v){if(v>mx)mx=v})});
  var step=1;[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000].some(function(s){step=s;return Math.ceil(mx/s)<=5});
  var top=Math.max(step,step*Math.ceil(mx/step));
  var iw=W-pl-pr,ih=H-pt-pb,gw=iw/labels.length,k=series.length,bw=Math.min(24,gw*0.64/k),gap=3;
  var o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">';
  for(var t=0;t<=top;t+=step){
    var y=pt+ih-ih*t/top;
    o+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="ax" x="'+(pl-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+t+'</text>';
  }
  labels.forEach(function(l,i){
    var cx=pl+gw*i+gw/2,tip=l+': '+series.map(function(s){return s.name+' '+Math.round(s.vals[i]*10)/10}).join(', ');
    o+='<g class="col"><title>'+esc(tip)+'</title><rect class="hit" x="'+(pl+gw*i).toFixed(1)+'" y="'+pt+'" width="'+gw.toFixed(1)+'" height="'+ih+'" rx="6"/>';
    series.forEach(function(s,j){
      var v=s.vals[i];if(v<=0)return;
      var hh=Math.max(3,ih*v/top),x=cx-(k*bw+(k-1)*gap)/2+j*(bw+gap),yy=pt+ih-hh;
      o+='<path class="bar" fill="'+s.color+'" d="M'+x.toFixed(1)+' '+(yy+hh).toFixed(1)+'V'+(yy+4).toFixed(1)+'a4 4 0 0 1 4 -4h'+(bw-8).toFixed(1)+'a4 4 0 0 1 4 4V'+(yy+hh).toFixed(1)+'Z"/>';
    });
    o+='<text class="ax" x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text></g>';
  });
  o+='</svg>';
  var d=document.createElement('div');d.innerHTML=o;
  var table=h('table',{class:'sr'},h('caption',null,label),
    h('thead',null,h('tr',null,h('th',null,'Day'),series.map(function(s){return h('th',null,s.name)}))),
    h('tbody',null,labels.map(function(l,i){return h('tr',null,h('td',null,l),series.map(function(s){return h('td',null,String(Math.round(s.vals[i]*10)/10))}))})));
  var wrap=h('div',null,d.firstChild,table);
  return wrap;
}

      h('span',{class:'body'},h('div',{class:'t'},'Subjects done'),h('div',{class:'s'},subs.length?dn+' of '+subs.length+' checked off':'Add your subjects')),
      subs.length?h('span',{class:'cnt'},Math.round(100*dn/subs.length)+'%'):ic('arrow',16)));
}

/* ---------- subjects checklist ---------- */
function subjectsSorted(){return S.subjects.slice().sort(function(a,b){return (a.at||0)-(b.at||0)||(a.name<b.name?-1:1)})}
function doneMap(id){var c=S.checks[id];return c&&c.done&&typeof c.done==='object'?c.done:{}}
function saveChecks(done){
  S.checks[S.uid]={done:done,at:Date.now()};
  if(!S.db)return;
  var body={done:done,at:Date.now()};
  chain=chain.then(function(){return S.db.doc('checks/'+S.uid).set(body)}).catch(writeFailed);
}
function toggleSubject(sid){
  var d=Object.assign({},doneMap(S.uid)),was=!!d[sid];
  if(was)delete d[sid];else d[sid]=Date.now();
  saveChecks(d);
  var subs=S.subjects,all=subs.length&&subs.every(function(x){return d[x.id]});
  render();
  if(!was&&all){toast('Every subject checked off. Nice.');confetti()}
}
function addSubject(name,cat){
  name=name.trim().slice(0,60);
  if(!name){toast('Type a subject name.');return Promise.resolve()}
  if(S.subjects.some(function(x){return x.name.toLowerCase()===name.toLowerCase()})){toast('That subject is already on the list.');return Promise.resolve()}
  var sj={id:'s'+rid(),name:name,cat:cat||'EE',by:S.uid||'local',at:Date.now()};
  S.subjects.push(sj);
  if(!S.db)return Promise.resolve();
  return S.db.doc('subjects/'+sj.id).set({name:sj.name,cat:sj.cat,by:sj.by,at:sj.at}).catch(writeFailed);
}
function subjectCat(sj){return STARTERS[sj.cat]?sj.cat:'Other'}
function removeSubject(sj){
  S.subjects=S.subjects.filter(function(x){return x.id!==sj.id});
  var d=Object.assign({},doneMap(S.uid));if(d[sj.id]){delete d[sj.id];saveChecks(d)}
  if(S.db)S.db.doc('subjects/'+sj.id).delete().catch(writeFailed);
  S.confirmSub=null;render();
}
function subjectRow(sj,mine,ids){
  var done=!!mine[sj.id],who=ids.filter(function(id){return doneMap(id)[sj.id]}),canDel=(sj.by===S.uid||S.isOwner)&&canMake(),sure=S.confirmSub===sj.id;
  return h('div',{class:'sj'+(done?' done':'')},
    h('button',{class:'tick',type:'button','aria-pressed':String(done),'aria-label':(done?'Uncheck ':'Check off ')+sj.name,disabled:canMake()?null:true,onclick:function(){toggleSubject(sj.id)}},ic('check',16)),
    h('div',null,h('div',{class:'nm'},sj.name),h('div',{class:'sub'},done?'You finished '+ago(mine[sj.id]):'Not done yet')),
    h('div',{class:'squad','aria-label':who.length+' of '+ids.length+' members done'},who.slice(0,6).map(function(id){var a=avatar(id,28);a.title=nm(id);return a}),who.length>6?h('span',{class:'cnt'},'+'+(who.length-6)):null),
    h('div',{class:'row',style:'gap:8px;flex-wrap:nowrap'},h('span',{class:'cnt'},who.length+'/'+ids.length),
      canDel?h('button',{class:'btn sm xbtn'+(sure?' danger':''),type:'button','aria-label':sure?'Tap again to remove '+sj.name:'Remove '+sj.name,title:sure?'Tap again to remove':'Remove',onclick:function(){if(!sure){S.confirmSub=sj.id;render();return}removeSubject(sj)}},ic('trash',15)):null));
}
function viewSubjects(){
  var subs=subjectsSorted(),mine=doneMap(S.uid),ids=memberIds(),out=[];
  var groups=SUBJECT_CATS.map(function(c){return{key:c[0],name:c[1],items:subs.filter(function(x){return subjectCat(x)===c[0]})}});
  var other=subs.filter(function(x){return subjectCat(x)==='Other'});
  if(other.length)groups.push({key:'Other',name:'Other',items:other});
  var dn=subs.filter(function(x){return mine[x.id]}).length;
  out.push(h('div',{class:'pagehead'},h('div',null,h('span',{class:'eyebrow'},'Checklist'),h('h1',null,'Subjects')),
    subs.length?h('span',{class:'pill lime'},dn+' of '+subs.length+' done'):null));
  if(!S.loaded){out.push(h('div',{class:'card empty',style:'color:var(--muted)'},'Loading…'));return out}
  var pct=subs.length?Math.round(100*dn/subs.length):0;
  out.push(h('div',{class:'card stack'},
    h('div',{class:'row between'},h('h2',{class:'h2'},'Your progress'),h('span',{class:'mono',style:'color:var(--lime);font-weight:700'},pct+'%')),
    h('div',{class:'meter',role:'img','aria-label':dn+' of '+subs.length+' subjects done'},h('i',{style:'width:'+pct+'%'})),
    h('div',{class:'tiles',style:'margin-top:4px'},groups.map(function(g){
      var gd=g.items.filter(function(x){return mine[x.id]}).length;
      return h('div',{class:'row',style:'gap:10px;flex-wrap:nowrap;background:var(--surface2);border-radius:16px;padding:12px 16px'},
        h('span',{class:'eyebrow'},g.key),h('div',{class:'meter',style:'flex:1'},h('i',{style:'width:'+(g.items.length?Math.round(100*gd/g.items.length):0)+'%'})),h('span',{class:'cnt'},gd+'/'+g.items.length));
    }))));
  groups.forEach(function(g){
    var gd=g.items.filter(function(x){return mine[x.id]}).length,real=!!STARTERS[g.key];
    var card=h('div',{class:'card stack'},
      h('div',{class:'row between'},h('div',null,h('span',{class:'eyebrow'},g.key),h('h2',{class:'h2',style:'margin-top:4px'},g.name)),
        h('span',{class:'mono',style:'color:var(--lime);font-weight:700'},gd+'/'+g.items.length+' done')));
    card.append(g.items.length?h('div',null,g.items.map(function(sj){return subjectRow(sj,mine,ids)})):h('div',{class:'muted'},'No subjects here yet.'));
    if(real&&canMake()){
      var inp=h('input',{type:'text',id:'nsub-'+g.key,maxlength:'60',placeholder:CAT_HINT[g.key],'aria-label':'New '+g.key+' subject'});
      card.append(h('form',{class:'addrow',onsubmit:function(ev){ev.preventDefault();addSubject(inp.value,g.key).then(function(){render();var el=document.getElementById('nsub-'+g.key);if(el)el.focus()})}},inp,h('button',{class:'btn primary',type:'submit'},ic('plus',16),'Add')));
      var missing=STARTERS[g.key].filter(function(n){return !S.subjects.some(function(x){return x.name.toLowerCase()===n.toLowerCase()})});
      if(missing.length)card.append(h('div',{class:'row'},h('button',{class:'btn sm',type:'button',onclick:function(){Promise.all(missing.map(function(n){return addSubject(n,g.key)})).then(function(){render();toast(missing.length+' suggested subjects added.')})}},'Add '+missing.length+' suggested '+g.key+' subjects'),
        h('span',{class:'muted',style:'font-size:12px'},'A starting list. Rename or remove to match your syllabus.')));
    }
    out.push(card);
  });
  return out;
}

/* ---------- edit profile ---------- */
function readPhoto(file){
  return new Promise(function(resolve,reject){
    if(!file||!/^image\//.test(file.type)||file.size>15*1024*1024){reject();return}
    var fr=new FileReader();
    fr.onerror=function(){reject()};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){reject()};
      img.onload=function(){
        var sz=Math.min(img.width,img.height),c=document.createElement('canvas');
        c.width=c.height=128;
        c.getContext('2d').drawImage(img,(img.width-sz)/2,(img.height-sz)/2,sz,sz,0,0,128,128);
        resolve(c.toDataURL('image/jpeg',0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function editProfileCard(){
  var nameIn=h('input',{type:'text',id:'pname',maxlength:'46',placeholder:'ENGR. Juan Dela Cruz',value:myName()||'ENGR. '});engrInput(nameIn);
  var fileIn=h('input',{type:'file',id:'ppic',accept:'image/*','aria-label':'Choose a profile photo',onchange:function(ev){
    var f=ev.target.files&&ev.target.files[0];if(!f)return;
    readPhoto(f).then(function(url){putStats({pic:url});toast('Photo updated.');render()}).catch(function(){toast('Could not use that image. Try a JPG or PNG.')});
  }});
  return h('div',{class:'card stack'},h('h2',{class:'h2'},'Edit profile'),
    h('div',{class:'row',style:'align-items:flex-start;gap:22px'},avatar(S.uid,96,true),
      h('div',{class:'stack',style:'flex:1;min-width:240px'},
        h('form',{class:'field',onsubmit:function(ev){ev.preventDefault();var v=engr(nameIn.value).slice(0,46);putStats({dn:v});toast(v?'Name saved.':'Name reset.');render()}},
          h('label',{for:'pname'},'Display name'),
          h('div',{class:'addrow'},nameIn,h('button',{class:'btn primary',type:'submit'},'Save name'))),
        h('div',{class:'field'},h('label',{for:'ppic'},'Photo'),
          h('div',{class:'row'},fileIn,picOf(S.uid)?h('button',{class:'btn sm',type:'button',onclick:function(){putStats({pic:''});render()}},'Remove photo'):null),
          h('div',{class:'muted',style:'font-size:12px'},'Your photo is cropped square and shrunk. Everyone in the club can see it.')))),
    h('div',{class:'field'},h('label',null,'Or pick an emoji'),
      h('div',{class:'avpick',role:'group','aria-label':'Choose an emoji avatar'},AVS.map(function(e,i){
        return h('button',{type:'button','aria-label':'Avatar '+e,'aria-pressed':String(!picOf(S.uid)&&avOf(S.uid)===e),onclick:function(){putStats({av:i,pic:''});render()}},e);
      }))));
}

/* ---------- keyboard ---------- */
document.getElementById('brand').addEventListener('click',function(){if(S.access==='member')go('home');else window.scrollTo(0,0)});
document.addEventListener('keydown',function(ev){
  var r=S.run;
  if(S.view!=='run'||!r||r.done)return;
  var t=ev.target&&ev.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(r.mode==='flash'){
    if(ev.key===' '){ev.preventDefault();flipCard()}
    else if(r.flip&&ev.key==='ArrowRight'){gotIt(true)}
    else if(r.flip&&ev.key==='ArrowLeft'){gotIt(false)}
  }else if((r.mode==='quiz'||r.mode==='learn')&&r.ans&&ev.key==='Enter'&&t!=='BUTTON'){advance()}
});

/* ---------- boot and live data ---------- */
async function names(){
  if(!S.user)return;
  var ids=new Set();
  if(S.uid)ids.add(S.uid);
  S.decks.forEach(function(d){if(d.owner)ids.add(d.owner)});
  [S.stats,S.roster,S.requests,S.blocked].forEach(function(o){Object.keys(o).forEach(function(k){ids.add(k)})});
  if(S.settings.ownerId)ids.add(S.settings.ownerId);
  try{S.prof=await S.user.profiles(Array.from(ids))}catch(e){}
}
async function refresh(){
  await names();
  S.loaded=true;
  var v=S.view;
  if(['home','decks','ranks','profile','members','exam','plan','subjects','settings','insights','games'].indexOf(v)>=0)render();else if(v==='chat'){renderNav();drawChat(false)}else renderNav();
}
function computeAccess(){
  var a;
  if(S.isOwner)a='member';
  else if(!(S.flags.sr&&S.flags.sb&&S.flags.rq))a='loading';
  else{
    var r=S.selfRoster;
    if(S.selfBlocked||(r&&r.status==='blocked'))a='blocked';
    else if(r)a='member';
    else a=S.myReq?'pending':'none';
  }
  S.access=a;
  if(a==='member'&&!S.dataOn)startData();
  if(a!=='member'&&a!=='loading'&&S.dataOn)stopData();
  render();
}
function startData(){
  S.dataOn=true;S.decksReady=false;
  var D=S.dunsubs,db=S.db;
  D.push(db.collection('decks').onSnapshot(function(snap){
    S.decks=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;x.cards=x.cards||[];return x});
    S.decksReady=true;refresh();
  },function(){S.loaded=true;render();toast('Lost the live connection. Reload the page to reconnect.')}));
  D.push(db.collection('stats').onSnapshot(function(snap){
    var st={};snap.docs.forEach(function(d){st[d.id]=d.data()||{}});
    S.stats=st;refresh();
  },function(){S.loaded=true;render()}));
  D.push(db.collection('roster').onSnapshot(function(snap){
    var ro={};snap.docs.forEach(function(d){ro[d.id]=d.data()||{}});
    S.roster=ro;refresh();
  },function(){}));
  D.push(db.doc('club/settings').onSnapshot(function(snap){
    S.settings=snap.exists?(snap.data()||{}):{};
    if(S.isOwner&&S.settings.ownerId!==S.uid&&!S.ownerWriting){
      S.ownerWriting=true;
      db.doc('club/settings').set(Object.assign({},S.settings,{ownerId:S.uid})).catch(function(){}).then(function(){S.ownerWriting=false});
    }
    refresh();
  },function(){}));
  D.push(db.collection('games').orderBy('createdAt','desc').limit(20).onSnapshot(function(snap){
    S.games=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;x.qs=x.qs||[];return x});
    if(S.view==='games')render();else renderNav();
  },function(){}));
  D.push(function(){if(S.gpUnsub){S.gpUnsub();S.gpUnsub=null}S.gameId=null});
  D.push(db.collection('chat').orderBy('at','desc').limit(150).onSnapshot(function(snap){
    S.chat=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x}).filter(function(x){return typeof x.text==='string'&&x.at}).sort(function(a,b){return a.at-b.at});
    if(S.chatSeen===null){S.chatSeen=chatLoadSeen();if(S.chatSeen===null)S.chatSeen=S.chat.length?S.chat[S.chat.length-1].at:Date.now()}
    if(S.view==='chat'){chatMarkSeen();drawChat(false)}
    renderNav();
  },function(){}));
  D.push(db.collection('plans').onSnapshot(function(snap){
    S.plans=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});refresh();
  },function(){}));
  D.push(db.collection('subjects').onSnapshot(function(snap){
    S.subjects=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});refresh();
  },function(){}));
  D.push(db.collection('checks').onSnapshot(function(snap){
    var ck2={};snap.docs.forEach(function(d){ck2[d.id]=d.data()||{}});S.checks=ck2;refresh();
  },function(){}));
  if(S.isOwner){
    D.push(db.collection('requests').onSnapshot(function(snap){
      var rq={};snap.docs.forEach(function(d){rq[d.id]=d.data()||{}});
      S.requests=rq;refresh();
    },function(){}));
    D.push(db.collection('blocked').onSnapshot(function(snap){
      var bl={};snap.docs.forEach(function(d){bl[d.id]=d.data()||{}});
      S.blocked=bl;refresh();
    },function(){}));
  }
}
function stopData(){
  S.dunsubs.forEach(function(f){try{f()}catch(e){}});
  S.dunsubs=[];S.dataOn=false;S.games=[];S.gp={};S.decks=[];S.stats={};S.roster={};S.plans=[];S.subjects=[];S.checks={};S.loaded=false;
}
async function boot(){
  render();
  var cl=window.claude;
  try{
    if(cl&&cl.use){
      S.user=await cl.use('user');
      if(S.user){
        S.uid=await S.user.id();
        S.isOwner=await S.user.isOwner();
        var cw=await S.user.can('data.write');
        S.canWrite=cw===false?false:null;
        try{S.myName=((await S.user.me()).name)||''}catch(e){}
      }
      S.db=await cl.use('db');
      try{S.dl=await cl.use('downloads')}catch(e){S.dl=null}
      try{
        S.sample=await cl.use('sample');
        if(S.sample){var lim=await S.sample.limits().catch(function(){return null});S.imgOk=!!(lim&&lim.images)}
      }catch(e){S.sample=null}
    }
  }catch(e){S.db=null}
  if(!S.db){S.access='member';S.loaded=true;render();return}
  if(!S.uid){S.canWrite=false;S.access=S.isOwner?'member':'none';if(S.access==='member')startData();render();return}
  if(S.isOwner){S.access='member';startData();render();return}
  S.unsubs.push(S.db.doc('roster/'+S.uid).onSnapshot(function(snap){
    S.selfRoster=snap.exists?snap.data():null;S.flags.sr=true;computeAccess();
  },function(){S.flags.sr=true;computeAccess()}));
  S.unsubs.push(S.db.doc('blocked/'+S.uid).onSnapshot(function(snap){
    S.selfBlocked=snap.exists?snap.data():null;S.flags.sb=true;computeAccess();
  },function(){S.flags.sb=true;computeAccess()}));
  S.unsubs.push(S.db.doc('requests/'+S.uid).onSnapshot(function(snap){
    S.myReq=snap.exists?snap.data():null;S.flags.rq=true;computeAccess();
  },function(){S.flags.rq=true;computeAccess()}));
}
loadPrefs();navInit();
boot();
})();
